# Optional: `pre-commit install --hook-type pre-commit --hook-type commit-msg`.
# Without the framework, `python ci/install-hooks.py` writes plain git hooks that do the same.
repos:
  - repo: local
    hooks:
      - id: gates-staged
        name: gates (staged files)
        entry: python -I ci/gates.py --staged --skip tests
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-title
        name: Conventional Commits title
        entry: python -I ci/install-hooks.py check-message
        language: system
        stages: [commit-msg]
