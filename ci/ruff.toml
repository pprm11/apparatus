# Rule set pinned by name: ruff's default selection changes between releases.
# Kept to rules that point at breakage (syntax, undefined or unused names, comparisons that are always
# wrong, bare except). Style rules (E401, E741 ...) are left out on purpose.
target-version = "py310"
line-length = 120

[lint]
select = ["E9", "F", "E711", "E712", "E713", "E714", "E722"]

[lint.per-file-ignores]
# Known unused imports, baselined so this PR touches no content (the productize session edits tests/).
# Remove an entry when the import is deleted.
"tests/test_decisions.py" = ["F401"]
"tests/test_shell_sync.py" = ["F401"]
# Arrived on main with the sync and secrets-backup work; baselined so this PR touches no content.
# Remove an entry when the line is fixed.
"tests/test_lint.py" = ["F541"]
"tools/secrets_backup.py" = ["F841"]
