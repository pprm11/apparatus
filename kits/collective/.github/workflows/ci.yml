name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # Every gate in ci/gates.py and ci/repo_gates.py, plus the unit tests in ci/, on Linux.
  # COLLECTIVE_DENY_TERMS and COLLECTIVE_DENY_COMPANIES are repository variables with the private lists (people and chats;
  # other companies and their clients),
  # comma separated; it is not in the repo so the list itself leaks nothing.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTIVE_DENY_TERMS: ${{ vars.COLLECTIVE_DENY_TERMS }}
      COLLECTIVE_DENY_COMPANIES: ${{ vars.COLLECTIVE_DENY_COMPANIES }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3
          npm install --global markdownlint-cli2@0.14.0
          command -v shellcheck
      - name: Run all gates
        run: python -I ci/gates.py --strict

  # Secrets in the whole history. The binary is pinned by version and checked against its published sha256.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          rm gitleaks.tgz
      - name: Scan history
        run: '"$RUNNER_TEMP/gl/gitleaks" git --redact --no-banner --verbose .'

  # Conventional Commits title; squash merges use it as the commit message.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python -I ci/gates.py --only commit-title

  # The team reads this repo on Windows: line endings, path length and reserved names must hold there.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run Windows-relevant gates
        run: python -I ci/gates.py --strict --only eol,paths,text,exec-bit,registry,glossary-format,tests
        shell: bash
